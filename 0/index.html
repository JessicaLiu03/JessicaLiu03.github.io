<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project 0 &middot; CS180</title>
    <style>
        :root {
            --bg: #f4f1ea;
            --surface: #fffdf8;
            --ink: #23201b;
            --muted: #6f6a60;
            --accent: #b5502a;
            --border: #e4ddcf;
            --shadow: 0 18px 40px -18px rgba(45, 38, 28, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 3rem 1.25rem 4rem;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 15% 0%, #ece4d3 0%, transparent 45%),
                radial-gradient(circle at 100% 100%, #e7d9c4 0%, transparent 40%),
                var(--bg);
            min-height: 100vh;
            line-height: 1.6;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back:hover { color: var(--accent); }

        header {
            margin: 1.75rem 0 2.5rem;
        }

        .eyebrow {
            margin: 0 0 0.5rem;
            font-size: 0.8rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--accent);
            font-weight: 700;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.25rem, 6vw, 3.25rem);
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .lede {
            margin: 1rem 0 0;
            font-size: 1.1rem;
            color: var(--muted);
            max-width: 52ch;
        }

        figure {
            margin: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1rem;
            box-shadow: var(--shadow);
        }

        figure img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        figcaption {
            margin-top: 0.85rem;
            font-size: 0.9rem;
            color: var(--muted);
            text-align: center;
        }

        footer {
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
            color: var(--muted);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1b1915;
                --surface: #262320;
                --ink: #f0ebe1;
                --muted: #a49c8d;
                --accent: #e2794f;
                --border: #38332c;
                --shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.6);
            }
            body {
                background:
                    radial-gradient(circle at 15% 0%, #2a251d 0%, transparent 45%),
                    radial-gradient(circle at 100% 100%, #2c2419 0%, transparent 40%),
                    var(--bg);
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <a class="back" href="../index.html">&larr; Portfolio</a>

        <header>
            <p class="eyebrow">CS180 &middot; Project 0</p>
            <h1>Project 0</h1>
            <p class="lede">My first project in CS180 - putting together a simple gif that demonstrates the dolly zoom effect.</p>
        </header>

        <figure>
            <img src="./media/ezgif.com-gif-maker.gif" alt="Animated result for Project 0">
            <figcaption>Animated GIF output</figcaption>
        </figure>

        <footer>
            Jessica Liu &middot; UC Berkeley
        </footer>
    </div>
</body>
</html>
